name: rollperiod
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.15+15

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  sensors_plus: ^6.1.1
  flutter_riverpod: ^2.6.1
  fl_chart: ^0.71.0
  permission_handler: ^11.3.1
  share_plus: ^10.1.4
  cross_file: ^0.3.4
  path_provider: ^2.1.5
  vibration: ^3.1.3
  torch_light: ^1.1.0
  geolocator: ^13.0.2
  audioplayers: ^6.1.0
  excel: ^4.0.6
  file_picker: ^8.1.7
  csv: ^6.0.0
  syncfusion_flutter_charts: ^28.1.37
  image: ^3.3.0
  scidart: 0.0.2-dev.12
  fftea: ^1.5.0
  equations: 5.0.2
  shared_preferences: ^2.3.5
  provider: ^6.1.2
  tutorial_coach_mark: ^1.2.11
  cupertino_icons: ^1.0.8

  intl: any
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
    - assets/images/
    - assets/sounds/alarm1.mp3
    - assets/sounds/alarm2.mp3
    - assets/sounds/alarm3.mp3
    - assets/sounds/alarm4.mp3
    - assets/icons/roll.png
    - assets/icons/pitch.png

  fonts:
    - family: CustomFont
      fonts:
        - asset: assets/fonts/Inter-Regular.otf
